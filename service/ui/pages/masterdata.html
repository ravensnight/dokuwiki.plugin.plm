<div class="plm-module">
    <h2>Master Data Management</h2>

    <h3>Categories</h3>
    <div class="section categories">
        <table>
            <thead>
                <th class="id">ID</th>
                <th class="name">Name</th>
                <th class="description">Description</th>
                <th class="sortorder">Sort Order</th>
                <th class="status">Status</th>
            </thead>

            <template x-for="item in data.categories" :key="item.id">
                <tr>
                    <td class="id" x-text="item.id"></td>
                    <td class="name" x-text="item.name"></td>
                    <td class="description" x-text="item.description"></td>
                    <td class="sortorder" x-text="item.sortorder"></td>
                    <td class="status" x-text="item.status"></td>
                </tr>
            </template>
        </table>
    </div>

    <h3>Status</h3>
    <div class="section status">
        <table>
            <thead>
                <th class="id">ID</th>
                <th class="name">Name</th>
                <th class="description">Description</th>
                <th class="sortorder">Sort Order</th>
                <th class="status">Status</th>
            </thead>
        
            <template x-for="item in data.status" :key="item.id">
                <tr>
                    <td class="id" x-text="item.id"></td>
                    <td class="name" x-text="item.name"></td>
                    <td class="description" x-text="item.description"></td>
                    <td class="sortorder" x-text="item.sortorder"></td>
                    <td class="status" x-text="item.status"></td>
                </tr>
            </template>
        </table>
    </div>

    <h3>Company Types</h3>
    <div class="section companytypes">
        <table>
            <thead>
                <th class="id">ID</th>
                <th class="name">Name</th>
                <th class="description">Description</th>
                <th class="sortorder">Sort Order</th>
                <th class="status">Status</th>
            </thead>
        
            <template x-for="item in data.companyTypes" :key="item.id">
                <tr>
                    <td class="id" x-text="item.id"></td>
                    <td class="name" x-text="item.name"></td>
                    <td class="description" x-text="item.description"></td>
                    <td class="sortorder" x-text="item.sortorder"></td>
                    <td class="status" x-text="item.status"></td>
                </tr>
            </template>
        </table>
    </div>
</div>
