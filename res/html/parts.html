<div class="plm-module">
    <h2>Parts Management</h2>

    <h3>Parts</h3>

    <table>
        <thead>
            <th class="id">ID</th>
            <th class="ipn">IPN</th>
            <th class="description">Description</th>
            <th class="category">Category</th>
            <th class="action">Action</th>
        </thead>
        <template x-for="item in control.partList" :key="item.id">
            <tr :class="{ 'selected' : control.partSelected.id == item.id }" >
                <td class="id"x-text="item.id"></td>
                <td class="ipn">
                    <a href="#" @click.prevent="control.selectPart(item.id)" x-text="item.ipn"></a>
                </td>
                <td class="description" x-text="item.description"></td>
                <td class="category" x-text="control.getCategoryName(item.categoryId)"></td>
                <td class="action">
                    <a href="#" @click.prevent="control.deletePartItem(item.id)" >delete</a>
                </td>
            </tr>
        </template>
    </table>

    <template x-if="control.partSelected" >
        <div class="editor-area">
            <p x-show="control.partLoading">Loading Details ...</p>
            <form x-show="!control.partLoading" @submit.prevent="control.partSubmit(event.submitter.value)">
                <div class="form-field">
                    <label for="part-id">ID:</label>
                    <input id="part-id" type="text" x-model="control.partSelected.id" readonly />
                </div>

                <div class="form-field">
                    <label for="part-ipn">IPN:</label>
                    <input id="part-ipn" type="text" x-model="control.partSelected.ipn" />
                </div>

                <div class="form-field">
                    <label for="part-description">Description:</label>
                    <input id="part-description" type="text" x-model="control.partSelected.description" />
                </div>

                <div class="form-field">
                    <label for="part-category">Category:</label>
                    <select id="part-category" x-model="control.partSelected.categoryId" >
                        <template x-for="cat in control.getCategories()" :key="cat.id">
                            <option :value="cat.id" x-text="cat.name" ></option>
                        </template>
                    </select>
                </div>

                <div class="button-area" >
                    <button x-show="control.partSelected.id" value="reset">Reset</button>
                    <button x-show="control.partSelected.id" value="submit">Submit</button>
                    <button x-show="!control.partSelected.id" value="submit">Create</button>
                </div>
            </form>
        </div>
    </template>

    <h3>Part Versions</h3>
    <p class="info" x-show="!control.partVersions">Select part to show versions</p>
    <div class="part-versions" x-show="control.partVersions" >
        <p x-show="control.partLoading" >Loading versions ...</p>

        <table x-show="!control.partLoading && (control.partVersions != null) && (control.partVersions.length > 0)" >
            <thead>
                <th class="id">ID</th>
                <th class="name">Name</th>
                <th class="major">Major</th>
                <th class="revision">Revision</th>
                <th class="status">Status</th>
                <th class="action">Actions</th>
            </thead>
            <template x-for="v in control.partVersions" :key="v.id">
                <tr :class="{ 'selected' : (control.partVersionEdit != null) && (control.partVersionEdit.id == v.id) }">
                    <td class='id' x-text="v.id"></td>
                    <td class='name'>
                        <a href="#" @click.prevent="control.selectVersion(v.id)" x-text="v.name"></a>
                    </td>
                    <td class='major' x-text="v.major"></td>
                    <td class='revision' x-text="v.revision"></td>
                    <td class='status' x-text="control.getStatusName(v.statusId)"></td>
                    <td class="action">
                        <a href="#" @click.prevent="control.deleteVersion(v.id)">delete</a>
                    </td>
                </tr>
            </template>
        </table>

        <div class="editor-area" x-show="!control.partLoading && (control.partVersions == null || control.partVersions.length == 0)">
            <form @submit.prevent="control.versionSubmit(event.submitter.value)">
                <div class="button-area">
                    <button value="createDefault">Create Default Version</button>
                </div>
            </form>
        </div>

        <template x-if="control.partVersionEdit != null">
            <div class="editor-area">
                <form x-show="control.partVersions.length > 0" @submit.prevent="control.versionSubmit(event.submitter.value)">
                    <div class="form-field">
                        <label for="version-id">ID:</label>
                        <input id="version-id" type="text" x-model="control.partVersionEdit.id" readonly />
                    </div>
        
                    <div class="form-field">
                        <label for="version-name">Name:</label>
                        <input id="version-name" type="text" x-model="control.partVersionEdit.name" />
                    </div>
        
                    <div class="form-field">
                        <label for="version-major">Major Version:</label>
                        <input id="version-major" type="text" x-model="control.partVersionEdit.major" readonly />
                    </div>
        
                    <div class="form-field">
                        <label for="version-revision">Revision:</label>
                        <input id="version-revision" type="text" x-model="control.partVersionEdit.revision" readonly />
                    </div>
        
                    <div class="form-field">
                        <label for="version-status">Category:</label>
                        <select id="version-status" x-model="control.partVersionEdit.statusId">
                            <template x-for="stat in control.getStatus()" :key="stat.id">
                                <option :value="stat.id" x-text="stat.name"></option>
                            </template>
                        </select>
                    </div>
        
                    <div class="button-area">
                        <button value="nextMajor" >New Major</button>
                        <button value="nextRevision" >New Revision</button>
                        <button value="submit">Submit</button>
                    </div>
                </form>
            </div>
        </template>
    </div>
</div>
