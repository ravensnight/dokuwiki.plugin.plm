<div class="plm-module">
    <h2>Product Management</h2>

    <template x-if="products" >
        <section x-data="products" x-html="html()"></section>
    </template>

    <template x-if="variants">
        <section x-data="variants" x-html="html()"></section>
    </template>    

    <template x-if="variantParts">
        <section x-data="variantParts" x-html="html()"></section>
    </template>
    
    <template x-if="partSelect" >
        <section x-data="partSelect" x-html="html()"></section>
    </template>
</div>
