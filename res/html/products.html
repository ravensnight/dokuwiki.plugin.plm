<div class="plm-module">
    <h2>Product Management</h2>

    <template x-if="products" >
        <section x-data="products" x-html="html()"></section>
    </template>

    <template x-if="variants">
        <section x-data="variants" x-html="html()"></section>
    </template>    

    <template x-if="variantParts">
        <section>
            <h3>Master Part Selection</h3>
            <ul class="radio-choice">
                <li>
                    <input type="radio" :value="-1" :id="_all" x-model="selectedCategory" />
                    <label :for="_all">All</label>
                </li>
            
                <template x-for="cat in categories">
                    <li>
                        <input type="radio" :value="cat.id" :id="cat.id" x-model="selectedCategory" />
                        <label :for="cat.id" x-text="`${cat.name}`"></label>
                    </li>
                </template>
            </ul>
            <div x-data="variantParts" class="content" x-html="html()"></div>
        </section>

    </template>
    
</div>
