<div class="plm-module">
    <h2>Companies Management</h2>

    <table>
        <thead>
            <th class="id">ID</th>
            <th class="name">Name</th>
            <th class="description">Description</th>
            <th class="type">Type</th>
            <th class="action">Action</th>
        </thead>
        <template x-for="item in control.companies" :key="item.id">
            <tr :class="{ 'selected' : control.companySelected.id == item.id }" >
                <td class="id" x-text="item.id"></td>
                <td class="name">
                    <a href="#" @click.prevent="control.selectCompany(item.id)" x-text="item.name"></a>
                </td>
                <td class="description" x-text="item.description"></td>
                <td class="type" x-text="control.getCompanyType(item.typeId)"></td>
                <td class="action">
                    <a href="#" @click.prevent="control.deleteCompany(item.id)">delete</a>
                </td>
            </tr>
        </template>
    </table>

    <template x-if="control.companySelected">
        <div class="editor-area">
            <p x-show="control.companyLoading">Loading Company Details ...</p>
            <form x-show="!control.companyLoading" @submit.prevent="control.submitCompany(event.submitter.value)">
                <div class="form-field">
                    <label for="company-id">ID:</label>
                    <input id="company-id" type="text" x-model="control.companySelected.id" readonly />
                </div>

                <div class="form-field">
                    <label for="company-name">Name:</label>
                    <input id="company-name" type="text" x-model="control.companySelected.name" />
                </div>

                <div class="form-field">
                    <label for="company-description">Description:</label>
                    <input id="company-description" type="text" x-model="control.companySelected.description" />
                </div>

                <div class="form-field">
                    <label for="company-type">Type:</label>
                    <select id="company-type" x-model="control.companySelected.typeId" >
                        <template x-for="type in control.companyTypes" :key="type.id">
                            <option :value="type.id" x-text="type.name" ></option>
                        </template>
                    </select>
                </div>

                <div class="button-area" >
                    <button x-show="control.companySelected.id" value="reset">Reset</button>
                    <button x-show="control.companySelected.id" value="submit">Submit</button>
                    <button x-show="!control.companySelected.id" value="submit">Create</button>
                </div>
            </form>
        </div>
    </template>

    <div x-show="!control.companySelected" class="button-area" >
        <button @click.prevent="control.selectCompany(null)">Create New</button>
    </div>

</div>
