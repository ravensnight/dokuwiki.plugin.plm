<template x-if="metadata.title" >
    <h3 x-text="`${metadata.title}`"></h3>
</template>

<!-- Table -->
<template x-if="items">
    <table>
        <thead>
            <tr>
                <template x-for="f in metadata.fields" :key="f.name">
                    <template x-if="!f.hidden">
                        <th :class="f.name" x-text="f.label"></th>
                    </template>
                </template>
                <th class="action">Action</th>
            </tr>
        </thead>
        <template x-for="i in items" :key="i.id">
            <tr :class="(current && current.id === i.id) ? 'selected' : ''" >
                <template x-for="f in metadata.fields" :key="f.name">
                    <template x-if="!f.hidden">
                        <td :class="f.name">
                            <template x-if="metadata.features['select'] && f.select">
                                <a href="#" @click.prevent="doSelect(i, f.name)" x-text="resolve(i, f)"></a>
                            </template>
                            <template x-if="!metadata.features['select'] || !f.select">
                                <span x-text="resolve(i, f)"></span>
                            </template>
                        </td>
                    </template>
                </template>
                <td class="action">
                    <template x-if="metadata.features['edit']" >
                        <a href="#" @click.prevent="doEdit(i.id)"><i class="fa fa-pencil-square-o"></i></a>
                    </template>

                    <template x-if="metadata.features['delete']">
                        <a href="#" @click.prevent="doDelete(i.id)"><i class="fa fa-remove"></i></a>
                    </template>
                </td>
            </tr>
        </template>
    </table>
</template>

<!-- New button for current table -->
<template x-if="metadata.features.create && !current" >
    <button @click.prevent="doEdit(null)" x-text="`New ${metadata.title}`"></button>
</template>

<!-- Editor for current table entries -->
<template x-if="(metadata.features.edit ||  metadata.features.create) && current && editing">
    <div>
        <h3 x-text="`${metadata.title} Editor`"></h3>
        <div class="editor-area">
            <form @submit.prevent="doSubmit(event.submitter.value)">
                <template x-for="f in metadata.fields">
                    <div x-show="!f.hidden" class="form-field">
                        <label :for="`editor-${f.name}`" x-text="f.label">ID:</label>
                        <template x-if="!f.editable">
                            <input :id="`editor-${f.name}`" type="text" :value="resolve(current, f)" readonly />
                        </template>
                        <template x-if="f.editable && !f.choice">
                            <input :id="`editor-${f.name}`" type="text" x-model="current[f.name]" />
                        </template>
                        <template x-if="f.editable && f.choice">
                            <select :id="`editor-${f.name}`" x-model="current[f.name]">
                                <template x-for="c in f.choice" :key="c.id">
                                    <option :value="c.id" x-text="c.name"></option>
                                </template>
                            </select>
                        </template>
                    </div>                        
                </template>

                <div class="button-area">
                    <button value="cancel">Cancel</button>
                    <button x-show="current.id && metadata.features.create" value="reset">Clear</button>
                    <button x-show="current.id" value="save">Submit</button>
                    <button x-show="!current.id" value="save">Create</button>
                </div>
            </form>
        </div>
    </div>
</template>
