<template x-if="metadata.title" >
    <h3 x-text="`${metadata.title}`"></h3>
</template>

<!-- Table -->
<template x-if="items">
    <table>
        <thead>
            <tr>
                <template x-for="f in metadata.fields" :key="f.name">
                    <template x-if="!f.hidden">
                        <th :class="f.name" x-text="f.label"></th>
                    </template>
                </template>
                <template x-if="(metadata['actions'] != null) && (Object.keys(metadata.actions).length > 0)">
                    <th class="action">Action</th>
                </template>
            </tr>
        </thead>
        <template x-for="i in items" :key="i.id">
            <tr :class="(current && current.id === i.id) ? 'selected' : ''" x-show="(metadata['filter'] == null) || (metadata.filter(i) == true)">
                <template x-for="f in metadata.fields" :key="f.name">
                    <template x-if="!f.hidden">
                        <td :class="f.name">
                            <!-- Select enabled -->
                            <template x-if="(metadata['select'] != null) && (f.select == true)">
                                <a href="#" @click.prevent="doSelect(i, f.name)" x-html="fieldHtml(i, f)"></a>
                            </template>
                            <!-- No select -->
                            <template x-if="!((metadata['select'] != null) && (f.select == true))">
                                <div x-html="fieldHtml(i, f)"></div>
                            </template>
                        </td>
                    </template>
                </template>
                <template x-if="(metadata['actions'] != null) && (Object.keys(metadata.actions).length > 0)">
                    <td class="action">
                        <template x-for="[action, spec] in Object.entries(metadata.actions)" >
                            <a href="#" @click.prevent="itemAction(i, action)">
                                <template x-if="spec.icon" >
                                    <i :class="spec.icon"></i>
                                </template>
                                <template x-if="!spec.icon">
                                    <span x-text="action" ></span>
                                </template>
                            </a>
                        </template>
                    </td>
                </template>
            </tr>
        </template>
    </table>
</template>

<!-- New button for current table -->
<template x-if="(defaultData != null) && !current" >
    <button @click.prevent="doCreate()" x-text="`Create new item`"></button>
</template>

<!-- Editor for current table entries -->
<template x-if="current && editing">
    <div>
        <h3 x-text="`${metadata.title} Editor`"></h3>
        <div class="editor-area">
            <form @submit.prevent="doSubmit(event.submitter.value)">
                <template x-for="f in metadata.fields">
                    <div x-show="!f.hidden" class="form-field">
                        <label :for="`editor-${f.name}`" x-text="f.label">ID:</label>
                        <template x-if="!f.editable">
                            <input :id="`editor-${f.name}`" type="text" :value="fieldValue(current, f)" readonly />
                        </template>
                        <template x-if="f.editable && !f.choice">
                            <input :id="`editor-${f.name}`" type="text" x-model="current[f.name]" />
                        </template>
                        <template x-if="f.editable && f.choice">
                            <select :id="`editor-${f.name}`" x-model="current[f.name]">
                                <template x-for="c in f.choice" :key="c.id">
                                    <option :value="c.id" x-text="c.name"></option>
                                </template>
                            </select>
                        </template>
                    </div>                        
                </template>

                <div class="button-area">
                    <button value="cancel">Cancel</button>
                    <button x-show="current.id && metadata.actions['create'] != null" value="reset">Clear</button>
                    <button x-show="current.id" value="save">Submit</button>
                    <button x-show="!current.id" value="save">Create</button>
                </div>
            </form>
        </div>
    </div>
</template>
