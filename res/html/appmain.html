<div x-data="appControl" class="plm-app">
    <header class="header">
        <nav class="navigation" >
            <button :class="{ 'selected' : view == 'products' }" @click="loadView('products')">Products</button>
            <button :class="{ 'selected' : view == 'parts' }" @click="loadView('parts')">Parts</button>
            <button :class="{ 'selected' : view == 'bom' }" >BOM*</button>
            <button :class="{ 'selected' : view == 'details' }" >Part Details*</button>
            <button :class="{ 'selected' : view == 'companies' }" @click="loadView('companies')">Companies</button>
            <button :class="{ 'selected' : view == 'masterdata' }" @click="loadView('masterdata')">Master Data</button>
        </nav>
    </header>
    <main class="content">
        <p x-show="loading">Loading...</p>

        <template x-if="error" >
            <p class="error" x-text="error"></p>
        </template>

        <template x-if="!loading" >
            <div x-data="control" x-html="html"></div>
        </template>
        
        <template x-if="!loading && !html" >
            <pre>Html could not be loaded.</pre>
        </template>
    </main>
</div>
