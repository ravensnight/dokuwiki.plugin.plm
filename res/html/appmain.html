<div x-data="appControl" class="plm-app">
    <header class="header">
        <nav class="navigation" >
            <button @click="loadView('products')">Products</button>
            <button @click="loadView('parts')">Parts</button>
            <button x-show="false" @click="loadView('versions')">Versions</button>
            <button @click="loadView('bom')">BOM</button>
            <button @click="loadView('companies')">Companies</button>
            <button @click="loadView('masterdata')">Master Data</button>
        </nav>
    </header>
    <main class="content">
        <p x-show="loading">Loading...</p>
        <p x-show="error" x-text="error"></p>

        <div x-show="!loading" x-ref="viewContainer" x-html="html"></div>
        <pre x-show="(!loading && !html)" >Html could not be loaded.</pre>
    </main>
</div>
